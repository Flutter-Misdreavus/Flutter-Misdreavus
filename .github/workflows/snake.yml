name: Generate contribution snake

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D84E80&color_dots=#F1F3F5,#DBF3FC,#A5E2F5,#70CEE9,#39BCE9
            dist/github-contribution-grid-snake-dark.svg?color_snake=#E65F95&color_dots=#F3F0F5,#E1F5FC,#B9E9F7,#84D5EE,#45BFE8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
