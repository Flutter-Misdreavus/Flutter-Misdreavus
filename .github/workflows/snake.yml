name: Generate contribution snake

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7ED957&color_dots=#FFF3C4,#FFD93D,#FFB84D,#FF9F45,#FF6B9D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7ED957&color_dots=#3B3B3B,#FFD93D,#FFB84D,#FF9F45,#FF6B9D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
