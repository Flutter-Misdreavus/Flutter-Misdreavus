name: Generate contribution snake

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#43A047&color_dots=#E8F5D0,#C5E1A5,#A5D6A7,#7ED957,#4E9A51
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#66BB6A&color_dots=#223026,#2E4029,#A5D6A7,#7ED957,#4E9A51

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
